const KEY="control_playeras_15oct_2026_8pestanas_v2";
let activeTab="";
const TABS=["Atl-Fml-5-kms-1a", "Atl-Fml-5-kms-2a", "Atl-Fml-10-kms-1a", "Atl-Fml-10-kms-2a", "Atl-Vnl-5-kms-1a", "Atl-Vnl-5-kms-2a", "Atl-Vnl-10-kms-1a", "Atl-Vnl-10-kms-2a"];
let state={};try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function change(id,field,value){state[id]={...(state[id]||{}),[field]:value};save()}
function chooseTab(tab){activeTab=tab;render()}
function render(){
 document.getElementById("tabs").innerHTML=`<button class="tab ${!activeTab?"selected":""}" onclick="chooseTab('')">Todas</button>`+TABS.map((t,i)=>`<button class="tab ${activeTab===t?"selected":""}" onclick="chooseTab('${t}')">${t}</button>`).join("");
 let delivered=PEOPLE.filter(p=>state[p.id]?.delivered).length;
 document.getElementById("total").textContent=PEOPLE.length;document.getElementById("given").textContent=delivered;document.getElementById("pending").textContent=PEOPLE.length-delivered;
 let km=document.getElementById("km").value,sex=document.getElementById("sex").value,age=document.getElementById("age").value,st=document.getElementById("status").value,q=norm(document.getElementById("search").value.trim());
 let arr=PEOPLE.filter(p=>(!activeTab||p.pestana===activeTab)&&(!km||p.km==km)&&(!sex||p.sexo===sex)&&(!age||p.grupo===age)&&(!st||(st==="yes"===!!state[p.id]?.delivered))&&(!q||norm([p.nombre,p.area,p.talla,p.edad].join(" ")).includes(q)));
 document.getElementById("count").textContent=`Mostrando ${arr.length} de ${PEOPLE.length} participantes`;
 let out="";
 for(let tab of TABS){
 let a=arr.filter(p=>p.pestana===tab);if(!a.length)continue;
 out+=`<h3 class="group">${tab} (${a.length})</h3><div class="scroll"><table><thead><tr><th>No.</th><th>Nombre completo</th><th>Edad</th><th>Talla</th><th>Mesa o Área</th><th>Entregada</th><th>Quién recoge / Observaciones</th></tr></thead><tbody>`;
 a.forEach((p,i)=>{let v=state[p.id]||{};out+=`<tr class="${v.delivered?"entregada":""}"><td>${i+1}</td><td><strong>${esc(p.nombre)}</strong></td><td>${p.edad}</td><td>${esc(p.talla)}</td><td>${esc(p.area)}</td><td><input aria-label="Entregar a ${esc(p.nombre)}" type="checkbox" ${v.delivered?"checked":""} onchange="change('${p.id}','delivered',this.checked)"></td><td><input type="text" placeholder="Nombre de quien recoge" value="${esc(v.note||"")}" oninput="note('${p.id}',this.value)"></td></tr>`});
 out+="</tbody></table></div>"
 }
 document.getElementById("lists").innerHTML=out||"<p>No hay participantes con estos filtros.</p>";
}
function note(id,value){state[id]={...(state[id]||{}),note:value};localStorage.setItem(KEY,JSON.stringify(state))}
function download(name,content,type){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportBackup(){download("respaldo_playeras_15oct.json",JSON.stringify({version:1,state},null,2),"application/json")}
function exportCSV(){let rows=[["Distancia","Sexo","Categoria","Nombre","Edad","Talla","Mesa o Area","Entregada","Quien recoge / Nota"],...PEOPLE.map(p=>[p.km,p.sexo,p.grupo,p.nombre,p.edad,p.talla,p.area,state[p.id]?.delivered?"SI":"NO",state[p.id]?.note||""])];download("control_entrega_playeras.csv","\ufeff"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv;charset=utf-8")}
